  /api/v1/palestras:
    get:
      tags:
        - Palestras
      summary: Lista palestras (paginado)
      description: "Lista palestras ordenadas por `palestraInicio`, com filtros opcionais:\n\n| Parâmetro | Descrição |\n|-----------|-----------|\n| `eventoId` | Somente palestras do evento |\n| `busca` | Texto contido no título (case-insensitive) |\n| `pagina`, `tamanhoPagina` | Paginação (máx. 100 por página) |\n| `ordenarPor`, `direcao` | Campo permitido e direção `Asc`/`Desc` |"
      operationId: ListarPalestras
      parameters:
        - name: EventoId
          in: query
          schema:
            type: string
            format: uuid
        - name: Busca
          in: query
          schema:
            type: string
        - name: Pagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: TamanhoPagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 20
        - name: OrdenarPor
          in: query
          schema:
            type: string
        - name: Direcao
          in: query
          schema:
            default: Asc
            $ref: '#/components/schemas/OrdenacaoDirecao'
      responses:
