  /api/v1/pessoas:
    get:
      tags:
        - Pessoas
      summary: Lista pessoas (paginado)
      description: "Lista pessoas ordenadas por nome, com filtros opcionais:\n\n| Parâmetro | Descrição |\n|-----------|-----------|\n| `busca` | Texto contido no nome, no e-mail ou na empresa (case-insensitive, até 100 caracteres) |\n| `estaAtivo` | `true`/`false` |\n| `pagina`, `tamanhoPagina` | Paginação (máx. 100 por página) |\n| `ordenarPor`, `direcao` | Campo permitido e direção `Asc`/`Desc` |\n\nPessoas excluídas nunca são retornadas. **Perfil exigido:** qualquer usuário autenticado."
      operationId: ListarPessoas
      parameters:
        - name: Busca
          in: query
          schema:
            type: string
        - name: EstaAtivo
          in: query
          schema:
            type: boolean
        - name: Pagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: TamanhoPagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 20
        - name: OrdenarPor
          in: query
          schema:
            type: string
        - name: Direcao
          in: query
          schema:
            default: Asc
            $ref: '#/components/schemas/OrdenacaoDirecao'
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfListarPessoasItemResponse'
      security:
        - Bearer: [ ]
    post:
      tags:
        - Pessoas
      summary: Cadastra uma pessoa
      description: "Cadastra uma pessoa (palestrante ou participante; o papel nasce do relacionamento com eventos e palestras).\n\n| Campo | Regra |\n|-------|-------|\n| `pessoaNome` | Obrigatório, até 150 caracteres |\n| `pessoaEmail` | Obrigatório, e-mail válido; armazenado em minúsculas; único entre pessoas ativas |\n| `pessoaDocumento` | Opcional; CPF com ou sem máscara, validado pelos dígitos verificadores; armazenado só com dígitos; único entre pessoas ativas |\n| `pessoaTelefone`, `pessoaEmpresa`, `pessoaCargo` | Opcionais (20/150/100 caracteres) |\n| `pessoaMiniBio` | Opcional, até 2000 caracteres |\n| `pessoaFotoUrl` | Opcional, URL absoluta http(s), até 500 caracteres |\n\n**Erros:** `400 Validacao` · `409 Pessoas.EmailJaCadastrado` · `409 Pessoas.DocumentoJaCadastrado`.\n\nPublica o evento de integração `PessoaCriada`. **Perfil exigido:** Administrador ou Organizador."
      operationId: CriarPessoa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPessoaRequest'
        required: true
      responses:
