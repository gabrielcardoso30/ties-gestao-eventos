openapi: '3.1.1'
info:
  title: Gestão de Eventos — API
  description: "API do **monolito modular** de gestão de eventos.\n\n## Convenções\n- Prefixo `api/v1/{modulo}`; recursos no plural, sem verbos na URL.\n- Erros seguem **RFC 9457 (Problem Details)** com a extensão `codigo` (estável, ex.: `Eventos.EventoNaoEncontrado`).\n- Listagens são paginadas: `pagina` e `tamanhoPagina` (máx. 100) e retornam `itens`, `total`, `totalPaginas`.\n- Todo response carrega `X-Correlation-Id` (aceita o enviado pelo cliente) para correlação com logs e traces.\n- Autenticação **Bearer JWT**: obtenha o token em `POST api/v1/identidade/sessoes`.\n\n## Módulos\nCada módulo possui seu schema no banco, seus casos de uso e seu grupo de endpoints (uma tag por módulo)."
  contact:
    name: Globalsys
    url: https://globalsys.com.br
  version: v1
servers:
  - url: http://localhost:5761/
paths:
  '/api/v1/auditoria/registros/{id}':
    get:
      tags:
        - Auditoria
      summary: Obtém o detalhe de um registro de auditoria
      description: "Retorna o registro completo, incluindo `dadosAnteriores` e `dadosNovos` como **strings JSON**:\n\n- `Inclusao`: `dadosAnteriores` nulo; `dadosNovos` com todas as propriedades da entidade.\n- `Alteracao`/`Exclusao`: apenas as propriedades modificadas, antes e depois.\n\n`traceId` permite correlacionar com logs e traces da requisição original. **Erros:** `404 Auditoria.RegistroNaoEncontrado`. **Perfil exigido:** Administrador."
      operationId: ObterRegistroAuditoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObterRegistroAuditoriaResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/auditoria/registros:
    get:
      tags:
        - Auditoria
      summary: Lista registros de auditoria (paginado)
      description: "Consulta a trilha de auditoria, do mais recente para o mais antigo (`ocorridoEm` desc). Filtros opcionais, combinados com AND:\n\n| Parâmetro | Descrição |\n|-----------|-----------|\n| `modulo` | Módulo de origem (ex.: `Locais`, `Pessoas`) |\n| `entidadeNome` | Nome da entidade (ex.: `Local`, `Sala`, `Pessoa`) |\n| `entidadeId` | Identificador da entidade (texto; normalmente um Guid) |\n| `usuarioId` | Guid do usuário que fez a alteração |\n| `operacao` | `Inclusao`, `Alteracao` ou `Exclusao` |\n| `ocorridoDe`, `ocorridoAte` | Intervalo (ISO-8601, inclusivo) do momento da alteração |\n| `pagina`, `tamanhoPagina` | Paginação (máx. 100 por página) |\n| `ordenarPor`, `direcao` | Campo permitido e direção `Asc`/`Desc` |\n\nA listagem não traz os dados antes/depois; use `GET /api/v1/auditoria/registros/{id}` para o detalhe.\n**Perfil exigido:** Administrador."
      operationId: ListarRegistrosAuditoria
      parameters:
        - name: Modulo
          in: query
          schema:
            type: string
        - name: EntidadeNome
          in: query
          schema:
            type: string
        - name: EntidadeId
          in: query
          schema:
            type: string
        - name: UsuarioId
          in: query
          schema:
            type: string
            format: uuid
        - name: Operacao
          in: query
          schema:
            type: string
        - name: OcorridoDe
          in: query
          schema:
            type: string
            format: date-time
        - name: OcorridoAte
          in: query
          schema:
            type: string
            format: date-time
        - name: Pagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: TamanhoPagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 20
        - name: OrdenarPor
          in: query
          schema:
            type: string
        - name: Direcao
          in: query
          schema:
            default: Desc
            $ref: '#/components/schemas/OrdenacaoDirecao'
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfListarRegistrosAuditoriaItemResponse'
      security:
        - Bearer: [ ]
  '/api/v1/eventos/{id}':
    get:
      tags:
        - Eventos
      summary: Obtém um evento
      description: "Retorna os dados do evento, a quantidade de inscrições confirmadas e, quando há local, o `localNome` (obtido do módulo Locais).\n\n**Perfil exigido:** qualquer usuário autenticado."
      operationId: ObterEvento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObterEventoResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
    delete:
      tags:
        - Eventos
      summary: Exclui (logicamente) um evento
      description: "Soft delete do evento e de suas inscrições: registros permanecem no banco com `ExcluidoEm`/`ExcluidoPor` preenchidos.\n\nPermitido somente em `Rascunho` ou `Cancelado` (`422 Eventos.EventoNaoPodeSerExcluido`). **Perfil exigido:** Administrador ou Organizador."
      operationId: ExcluirEvento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
    put:
      tags:
        - Eventos
      summary: Atualiza os dados de um evento
      description: "Atualiza nome, descrição, período, formato, local/link e capacidade. A situação é alterada apenas em `PATCH /{id}/situacao`.\n\n- Permitido somente em `Rascunho` ou `Publicado` (`422 Eventos.EventoNaoPodeSerAlterado`).\n- Mesmas regras de consistência de formato da criação; `localId` precisa existir (`422 Eventos.LocalNaoEncontrado`).\n\n**Perfil exigido:** Administrador ou Organizador."
      operationId: AtualizarEvento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarEventoRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtualizarEventoResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/eventos/{id}/trilhas':
    get:
      tags:
        - Eventos
      summary: Lista as trilhas de um evento
      description: Retorna as trilhas temáticas ordenadas por nome; use `estaAtivo=true` para seleção em palestras.
      operationId: ListarTrilhas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: EstaAtivo
          in: query
          schema:
            type: boolean
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListarTrilhasItemResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
    post:
      tags:
        - Eventos
      summary: Adiciona uma trilha temática ao evento
      description: O nome da trilha é único no evento. **Perfil exigido:** Administrador ou Organizador.
      operationId: AdicionarTrilha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdicionarTrilhaRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdicionarTrilhaResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/eventos/{id}/inscricoes':
    get:
      tags:
        - Eventos
      summary: Lista as inscrições de um evento (paginado)
      description: "Lista inscrições ordenadas pela data de realização, com nome e e-mail obtidos do módulo Pessoas em lote.\n\n| Parâmetro | Descrição |\n|-----------|-----------|\n| `inscricaoSituacao` | `Confirmada` ou `Cancelada` (omitido: todas) |\n| `pagina`, `tamanhoPagina` | Paginação (máx. 100 por página) |\n\n**Perfil exigido:** qualquer usuário autenticado."
      operationId: ListarInscricoes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: InscricaoSituacao
          in: query
          schema:
            $ref: '#/components/schemas/InscricaoSituacao'
        - name: Pagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: TamanhoPagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 20
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfListarInscricoesItemResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
    post:
      tags:
        - Eventos
      summary: Inscreve uma pessoa em um evento
      description: "Cria uma inscrição **Confirmada** e emite `InscricaoRealizada`.\n\n| Regra | Erro |\n|-------|------|\n| Evento deve estar `Publicado` ou `EmAndamento` | `422 Eventos.EventoNaoAceitaInscricoes` |\n| Pessoa deve existir no módulo Pessoas | `422 Eventos.PessoaNaoEncontrada` |\n| Pessoa sem inscrição confirmada prévia no evento | `409 Eventos.PessoaJaInscrita` |\n| Capacidade (`eventoCapacidadeMaxima` ou, se nula e há local, a capacidade total do local) não atingida | `422 Eventos.CapacidadeEsgotada` |\n\n**Perfil exigido:** qualquer usuário autenticado."
      operationId: InscreverParticipante
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InscreverParticipanteRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InscreverParticipanteResponse'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  /api/v1/eventos:
    get:
      tags:
        - Eventos
      summary: Lista eventos (paginado)
      description: "Lista eventos ordenados por data de início (mais recentes primeiro), com filtros opcionais:\n\n| Parâmetro | Descrição |\n|-----------|-----------|\n| `busca` | Texto contido no nome ou na descrição (case-insensitive) |\n| `eventoSituacao` | `Rascunho`, `Publicado`, `EmAndamento`, `Encerrado` ou `Cancelado` |\n| `eventoFormato` | `Presencial`, `Remoto` ou `Hibrido` |\n| `dataInicioDe`, `dataInicioAte` | Intervalo (ISO-8601) aplicado sobre `eventoDataInicio` |\n| `pagina`, `tamanhoPagina` | Paginação (máx. 100 por página) |\n| `ordenarPor`, `direcao` | Campo permitido e direção `Asc`/`Desc` |\n\nCada item traz `inscricoesConfirmadas`. **Perfil exigido:** qualquer usuário autenticado."
      operationId: ListarEventos
      parameters:
        - name: Busca
          in: query
          schema:
            type: string
        - name: EventoSituacao
          in: query
          schema:
            $ref: '#/components/schemas/EventoSituacao'
        - name: EventoFormato
          in: query
          schema:
            $ref: '#/components/schemas/EventoFormato'
        - name: DataInicioDe
          in: query
          schema:
            type: string
            format: date-time
        - name: DataInicioAte
          in: query
          schema:
            type: string
            format: date-time
        - name: Pagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: TamanhoPagina
          in: query
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
            default: 20
        - name: OrdenarPor
          in: query
          schema:
            type: string
        - name: Direcao
          in: query
          schema:
            default: Desc
            $ref: '#/components/schemas/OrdenacaoDirecao'
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfListarEventosItemResponse'
      security:
        - Bearer: [ ]
    post:
      tags:
        - Eventos
      summary: Cria um evento (em rascunho)
      description: "Cria um evento na situação **Rascunho**. Publique-o depois em `PATCH /api/v1/eventos/{id}/situacao`.\n\n| Formato | `localId` | `eventoLinkRemoto` |\n|---------|-----------|--------------------|\n| `Presencial` | obrigatório | — |\n| `Remoto` | não permitido | obrigatório |\n| `Hibrido` | obrigatório | obrigatório |\n\n- `eventoDataFim` deve ser posterior a `eventoDataInicio`.\n- `localId`, quando informado, precisa existir no módulo Locais (`422 Eventos.LocalNaoEncontrado`).\n- `eventoCapacidadeMaxima` é opcional; se omitida em evento com local, vale a capacidade total do local nas inscrições.\n\n**Perfil exigido:** Administrador ou Organizador."
      operationId: CriarEvento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarEventoRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriarEventoResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  '/api/v1/eventos/{id}/trilhas/{trilhaId}':
    delete:
      tags:
        - Eventos
      summary: Exclui logicamente uma trilha
      description: O evento deve manter ao menos uma trilha. **Perfil exigido:** Administrador ou Organizador.
      operationId: ExcluirTrilha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: trilhaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
    put:
      tags:
        - Eventos
      summary: Atualiza uma trilha do evento
      description: Atualiza identificação e disponibilidade da trilha. **Perfil exigido:** Administrador ou Organizador.
      operationId: AtualizarTrilha
      parameters:
        - name: id
          in: path
          required: true
